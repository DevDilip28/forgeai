[project]
name = "forgeai"
version = "0.1.0"
description = "Autonomous AI coding agent"
requires-python = ">=3.11"
dependencies = [
    "rich>=14.0.0",
    "rich-click>=1.9.0",
]

[project.scripts]
forgeai = "forgeai.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
