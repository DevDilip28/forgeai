[project]
name = "forgeai"
version = "0.1.0"
description = "Autonomous AI coding agent"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "ddgs>=9.16.0",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.14.3",
    "mcp<2.0.0",
    "pathspec>=1.1.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "rich>=14.0.0",
    "rich-click>=1.9.0",
    "sqlalchemy>=2.1.2",
]

[project.scripts]
forgeai = "forgeai.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
